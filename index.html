function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function money(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function liveGoats(){return db.goats.filter(g=>(g.status||'active')==='active')}
function goatOptions(selected=''){return `<option value="">${t('selectGoat')}</option>`+db.goats.map(g=>`<option value="${esc(g.id)}" ${g.id===selected?'selected':''}>${esc(g.id)} — ${esc(g.name||g.breed||g.sex)}</option>`).join('')}
function field(name,label,type='text',opts={}){let value=opts.value??'';let req=opts.required?'required':'';let full=opts.full?' full':'';let attrs=opts.attrs||'';let input='';if(type==='select'){input=`<select name="${name}" ${req} ${attrs}>${(opts.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`}else if(type==='textarea'){input=`<textarea name="${name}" ${req} ${attrs}>${esc(value)}</textarea>`}else{input=`<input name="${name}" type="${type}" value="${esc(value)}" ${req} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''} ${attrs}>`}return `<div class="field${full?' full':''}"><label>${label}${opts.required?' *':''}</label>${input}</div>`}
function goatField(name,label,required=false){return `<div class="field"><label>${label}${required?' *':''}</label><select name="${name}" ${required?'required':''}>${goatOptions()}</select></div>`}
function formBox(title,fields,submitText=t('save'),onSubmit='saveRecord(event)'){return `<section class="panel"><h3>${title}</h3><form onsubmit="${onSubmit}"><div class="form-grid">${fields}</div><div class="form-actions"><button type="submit">${submitText}</button><button type="button" class="secondary" onclick="render()">${t('cancel')}</button></div></form></section>`}
function addHeader(title,buttonLabel,action){return `<div class="page-title"><h2>${title}</h2>${buttonLabel?`<button onclick="${action}">${buttonLabel}</button>`:''}</div>`}
function table(headers,rows){if(!rows.length)return `<div class="empty">${t('noData')}</div>`;return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function rowCells(items){return `<tr>${items.map(x=>`<td>${x??''}</td>`).join('')}</tr>`}
function statusPill(s){let cl=s==='dead'||s==='overdue'?'bad':s==='sold'||s==='due'?'warn':'';return `<span class="pill ${cl}">${esc(s||'—')}</span>`}
function showPage(p){page=p;searchText='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function setLang(l){lang=l;document.documentElement.lang=l==='ta'?'ta':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));render()}
function render(){const app=document.getElementById('app');const map={dashboard:dashboardPage,goats:goatsPage,health:healthPage,breeding:breedingPage,births:birthsPage,mortality:mortalityPage,transactions:transactionsPage,inventory:inventoryPage,expenses:expensesPage,reports:reportsPage};app.innerHTML=(map[page]||dashboardPage)();document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n))}
function dashboardPage(){
 const live=liveGoats(),m=live.filter(g=>g.sex==='Male').length,f=live.filter(g=>g.sex==='Female').length,k=live.filter(g=>g.isKid==='yes').length;
 const due=db.health.filter(x=>x.nextDue&&x.nextDue<=today()).length, births=db.breeding.filter(x=>x.expected&&x.expected>=today()).length;
 const inc=db.finance.filter(x=>x.type==='Income').reduce((s,x)=>s+Number(x.amount||0),0),exp=db.finance.filter(x=>x.type==='Expense').reduce((s,x)=>s+Number(x.amount||0),0);
 const stats=[[t('total'),live.length,'All active goats'],[t('males'),m,'Active males'],[t('females'),f,'Active females'],[t('due'),due,'Based on next due date'],[t('birthSoon'),births,'Expected dates recorded'],[t('stock'),db.inventory.length,'Inventory item types'],[t('income'),money(inc),'Finance entries'],[t('expense'),money(exp),'Finance entries']];
 const recent=[...db.goats].slice(-6).reverse();
 return `${addHeader(t('dashboard'))}<div class="notice">${t('dataWarning')}</div><div class="cards">${stats.map((s,i)=>`<div class="card"><div class="stat-label">${s[0]}</div><div class="stat-value">${s[1]}</div><div class="stat-note">${s[2]}</div></div>`).join('')}</div><section class="panel"><h3>${t('quick')}</h3><div class="form-actions"><button onclick="showPage('goats');goatFormOpen=true;render()">${t('addGoat')}</button><button class="secondary" onclick="showPage('health');healthFormOpen=true;render()">${t('addHealth')}</button><button class="secondary" onclick="showPage('breeding');breedFormOpen=true;render()">${t('addBreed')}</button><button class="secondary" onclick="showPage('births');birthFormOpen=true;render()">${t('addBirth')}</button></div></section><section class="panel"><h3>${t('recent')}</h3>${table([t('id'),t('name'),t('sex'),t('breed'),t('status')],recent.map(g=>rowCells([esc(g.id),esc(g.name||'—'),esc(g.sex||'—'),esc(g.breed||'—'),statusPill(g.status||'active')])) )}</section><section class="panel"><h3>${t('upcoming')}</h3>${table([t('animal'),t('item'),t('nextDue')],db.health.filter(x=>x.nextDue).sort((a,b)=>a.nextDue.localeCompare(b.nextDue)).slice(0,8).map(x=>rowCells([esc(x.goatId),esc(x.item||x.type),`${esc(x.nextDue)} ${x.nextDue<today()?statusPill('overdue'):''}`])))}</section>`;
}
let goatFormOpen=false,healthFormOpen=false,breedFormOpen=false,birthFormOpen=false,mortFormOpen=false,transFormOpen=false,invFormOpen=false,finFormOpen=false;
function goatsPage(){let form=goatFormOpen?formBox(t('newGoat'),field('id',t('id'),'text',{required:true})+field('tag',t('tag'))+field('name',t('name'))+field('sex',t('sex'),'select',{required:true,options:[{value:'Male',label:t('male')},{value:'Female',label:t('female')},{value:'Unknown',label:t('unknown')} ]})+field('breed',t('breed'))+field('dob',t('dob'),'date')+field('weight',t('weight'),'number',{step:'0.1',min:0})+field('source',t('source'),'select',{options:[{value:'Purchased',label:t('purchased')},{value:'Farm born',label:t('farmBorn')}]})+field('status',t('status'),'select',{options:[{value:'active',label:t('active')},{value:'sold',label:t('sold')},{value:'dead',label:t('dead')}]})+field('pen',t('pen'))+field('mother',t('mother'))+field('father',t('father'))+field('isKid','Is kid?','select',{options:[{value:'no',label:'No'},{value:'yes',label:'Yes'}]})+field('notes',t('notes'),'textarea',{full:true}),'', 'saveGoat(event)'):'';
let rows=db.goats.filter(g=>JSON.stringify(g).toLowerCase().includes(searchText.toLowerCase())).map(g=>rowCells([`<b>${esc(g.id)}</b>`,esc(g.tag||'—'),esc(g.name||'—'),esc(g.sex||'—'),esc(g.breed||'—'),esc(g.dob||'—'),esc(g.weight||'—'),statusPill(g.status||'active'),`<button class="small danger" onclick="deleteRecord('goats','${esc(g.id)}')">${t('delete')}</button>`]));
return `${addHeader(t('goats'),goatFormOpen?'':t('addGoat'),"goatFormOpen=true;render()")}${form}<section class="panel"><div class="toolbar"><input placeholder="${t('search')}" value="${esc(searchText)}" oninput="searchText=this.value;renderTableOnly('goatTable',goatRows())"><button class="secondary" onclick="downloadCSV('goats')">${t('exportCSV')}</button></div><div id="goatTable">${table([t('id'),t('tag'),t('name'),t('sex'),t('breed'),t('dob'),t('weight'),t('status'),''],rows)}</div></section>`}
function goatRows(){return table([t('id'),t('tag'),t('name'),t('sex'),t('breed'),t('dob'),t('weight'),t('status'),''],db.goats.filter(g=>JSON.stringify(g).toLowerCase().includes(searchText.toLowerCase())).map(g=>rowCells([`<b>${esc(g.id)}</b>`,esc(g.tag||'—'),esc(g.name||'—'),esc(g.sex||'—'),esc(g.breed||'—'),esc(g.dob||'—'),esc(g.weight||'—'),statusPill(g.status||'active'),`<button class="small danger" onclick="deleteRecord('goats','${esc(g.id)}')">${t('delete')}</button>`])))}
function renderTableOnly(id,html){let el=document.getElementById(id);if(el)el.innerHTML=html}
function saveGoat(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(db.goats.some(g=>g.id===x.id)){alert('Goat ID already exists. Please use a unique ID.');return}db.goats.push(x);goatFormOpen=false;saveDB()}
function healthPage(){let f=healthFormOpen?formBox(t('healthTitle'),goatField('goatId',t('animal'),true)+field('type',t('recordType'),'select',{required:true,options:[{value:'Vaccination',label:t('vaccine')},{value:'Deworming',label:t('deworm')},{value:'Treatment',label:t('treatment')},{value:'Health check',label:t('checkup')}]})+field('date',t('date'),'date',{required:true,value:today()})+field('item',t('item'),'text',{required:true})+field('dose',t('dose'))+field('batch',t('batch'))+field('expiry',t('expiry'),'date')+field('nextDue',t('nextDue'),'date')+field('vet',t('vet'))+field('cost',t('cost'),'number',{min:0,step:'0.01'})+field('outcome',t('outcome'),'textarea',{full:true}),'','saveHealth(event)'):'';
return `${addHeader(t('health'),healthFormOpen?'':t('addHealth'),"healthFormOpen=true;render()")}${db.goats.length?'':`<div class="notice">${t('noGoats')}</div>`}${f}<section class="panel">${table([t('animal'),t('recordType'),t('date'),t('item'),t('dose'),t('nextDue'),t('vet')],db.health.slice().reverse().map(x=>rowCells([esc(x.goatId),esc(x.type),esc(x.date),esc(x.item),esc(x.dose||'—'),esc(x.nextDue||'—'),esc(x.vet||'—')])) )}</section>`}
function saveHealth(e){e.preventDefault();db.health.push(Object.fromEntries(new FormData(e.target)));healthFormOpen=false;saveDB()}
function breedingPage(){let f=breedFormOpen?formBox(t('breedingTitle'),goatField('femaleId',t('femaleId'),true)+goatField('maleId',t('maleId'))+field('matingDate',t('matingDate'),'date',{required:true,value:today()})+field('method',t('method'),'select',{options:[{value:'Natural',label:'Natural'},{value:'AI',label:'Artificial insemination'}]})+field('pregDate',t('pregDate'),'date')+field('result',t('result'),'select',{options:[{value:'Pending',label:'Pending'},{value:'Positive',label:'Positive'},{value:'Negative',label:'Negative'}]})+field('expected',t('expected'),'date')+field('notes',t('notes'),'textarea',{full:true}),'','saveBreed(event)'):'';
return `${addHeader(t('breeding'),breedFormOpen?'':t('addBreed'),"breedFormOpen=true;render()")}${f}<section class="panel">${table([t('femaleId'),t('maleId'),t('matingDate'),t('method'),t('pregDate'),t('result'),t('expected')],db.breeding.slice().reverse().map(x=>rowCells([esc(x.femaleId),esc(x.maleId||'—'),esc(x.matingDate),esc(x.method||'—'),esc(x.pregDate||'—'),esc(x.result||'Pending'),esc(x.expected||'—')])) )}</section>`}
function saveBreed(e){e.preventDefault();db.breeding.push(Object.fromEntries(new FormData(e.target)));breedFormOpen=false;saveDB()}
function birthsPage(){let f=birthFormOpen?formBox(t('birthTitle'),goatField('mother',t('mother'),true)+goatField('father',t('father'))+field('eventDate',t('eventDate'),'date',{required:true,value:today()})+field('bornMale',t('bornMale'),'number',{min:0,step:1,value:0})+field('bornFemale',t('bornFemale'),'number',{min:0,step:1,value:0})+field('stillborn',t('stillborn'),'number',{min:0,step:1,value:0})+field('birthType',t('birthType'),'select',{options:[{value:'Normal',label:t('normal')},{value:'Assisted',label:t('assisted')}]})+field('birthWeight',t('birthWeight'),'number',{min:0,step:'0.1'})+field('survival',t('survival'),'textarea',{full:true}),'','saveBirth(event)'):'';
return `${addHeader(t('births'),birthFormOpen?'':t('addBirth'),"birthFormOpen=true;render()")}${f}<section class="panel">${table([t('mother'),t('father'),t('eventDate'),t('bornMale'),t('bornFemale'),t('stillborn'),t('birthType'),t('survival')],db.births.slice().reverse().map(x=>rowCells([esc(x.mother),esc(x.father||'—'),esc(x.eventDate),esc(x.bornMale||0),esc(x.bornFemale||0),esc(x.stillborn||0),esc(x.birthType||'—'),esc(x.survival||'—')])) )}<p class="muted">For each live kid, register an individual goat profile with its own unique ID and parent IDs.</p></section>`}
function saveBirth(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));db.births.push(x);let n=Number(x.bornMale||0)+Number(x.bornFemale||0);if(n>0&&!confirm(`Birth event saved. ${n} live kid(s) recorded. Register each kid individually now from Goat register?`)){}birthFormOpen=false;saveDB()}
function mortalityPage(){let f=mortFormOpen?formBox(t('mortalityTitle'),goatField('goatId',t('animal'),true)+field('deathDate',t('deathDate'),'date',{required:true,value:today()})+field('cause',t('cause'))+field('vetFindings',t('vetFindings'),'textarea')+field('valueLost',t('valueLost'),'number',{min:0,step:'0.01'})+field('disposal',t('disposal'),'textarea',{full:true}),'','saveMortality(event)'):'';
return `${addHeader(t('mortality'),mortFormOpen?'':t('add'),"mortFormOpen=true;render()")}${f}<section class="panel">${table([t('animal'),t('deathDate'),t('cause'),t('vetFindings'),t('valueLost')],db.mortality.slice().reverse().map(x=>rowCells([esc(x.goatId),esc(x.deathDate),esc(x.cause||'—'),esc(x.vetFindings||'—'),money(x.valueLost)])))}</section>`}
function saveMortality(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));db.mortality.push(x);let g=db.goats.find(g=>g.id===x.goatId);if(g)g.status='dead';mortFormOpen=false;saveDB()}
function transactionsPage(){let f=transFormOpen?formBox(t('transactionTitle'),field('type',t('type'),'select',{required:true,options:[{value:'Purchase',label:t('purchase')},{value:'Sale',label:t('sale')}]})+field('transactionDate',t('transactionDate'),'date',{required:true,value:today()})+field('party',t('party'))+field('phone',t('phone'),'tel')+field('goatIds','Goat IDs (comma separated)')+field('qty',t('qty'),'number',{min:0,step:1})+field('price',t('price'),'number',{required:true,min:0,step:'0.01'})+field('paid',t('paid'),'number',{min:0,step:'0.01'})+field('invoice',t('invoice'))+field('notes',t('notes'),'textarea',{full:true}),'','saveTransaction(event)'):'';
return `${addHeader(t('transactions'),transFormOpen?'':t('add'),"transFormOpen=true;render()")}${f}<section class="panel">${table([t('type'),t('transactionDate'),t('party'),'Goat IDs',t('qty'),t('price'),t('paid'),t('balance'),t('invoice')],db.transactions.slice().reverse().map(x=>rowCells([esc(x.type),esc(x.transactionDate),esc(x.party||'—'),esc(x.goatIds||'—'),esc(x.qty||0),money(x.price),money(x.paid),money(Number(x.price||0)-Number(x.paid||0)),esc(x.invoice||'—')])) )}</section>`}
function saveTransaction(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));db.transactions.push(x);(x.goatIds||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(id=>{let g=db.goats.find(g=>g.id===id);if(g)g.status=x.type==='Sale'?'sold':'active'});transFormOpen=false;saveDB()}
function inventoryPage(){let f=invFormOpen?formBox(t('inventoryTitle'),field('name',t('item'),'text',{required:true})+field('category',t('category'),'select',{options:[{value:'Feed',label:t('feed')},{value:'Medicine',label:t('medicine')},{value:'Supplement',label:t('supplement')},{value:'Equipment',label:t('equipment')}]})+field('unit',t('unit'),'text',{placeholder:'kg, litre, bottle, packet'})+field('opening',t('opening'),'number',{min:0,step:'0.01',value:0})+field('added',t('added'),'number',{min:0,step:'0.01',value:0})+field('used',t('used'),'number',{min:0,step:'0.01',value:0})+field('reorder',t('reorder'),'number',{min:0,step:'0.01',value:0})+field('supplier',t('supplier'))+field('expiry',t('expiryShort'),'date')+field('cost',t('cost'),'number',{min:0,step:'0.01'})+field('notes',t('notes'),'textarea',{full:true}),'','saveInventory(event)'):'';
return `${addHeader(t('inventory'),invFormOpen?'':t('add'),"invFormOpen=true;render()")}${f}<section class="panel">${table([t('item'),t('category'),t('unit'),t('opening'),t('added'),t('used'),'Balance',t('reorder'),t('expiryShort')],db.inventory.map(x=>{let bal=Number(x.opening||0)+Number(x.added||0)-Number(x.used||0);return rowCells([esc(x.name),esc(x.category),esc(x.unit||'—'),esc(x.opening||0),esc(x.added||0),esc(x.used||0),`${bal<=Number(x.reorder||0)?statusPill('low stock'):''} ${bal}`,esc(x.reorder||0),esc(x.expiry||'—')])}))}</section>`}
function saveInventory(e){e.preventDefault();db.inventory.push(Object.fromEntries(new FormData(e.target)));invFormOpen=false;saveDB()}
function expensesPage(){let f=finFormOpen?formBox(t('financeTitle'),field('type',t('financeType'),'select',{required:true,options:[{value:'Income',label:t('incomeType')},{value:'Expense',label:t('expenseType')}]})+field('date',t('date'),'date',{required:true,value:today()})+field('category',t('categoryName'),'text',{required:true})+field('amount',t('amount'),'number',{required:true,min:0,step:'0.01'})+field('payment',t('payment'),'select',{options:[{value:'Cash',label:'Cash'},{value:'UPI',label:'UPI'},{value:'Bank',label:'Bank transfer'},{value:'Credit',label:'Credit'}]})+field('description',t('description'),'textarea',{full:true}),'','saveFinance(event)'):'';
let income=db.finance.filter(x=>x.type==='Income').reduce((s,x)=>s+Number(x.amount||0),0),expense=db.finance.filter(x=>x.type==='Expense').reduce((s,x)=>s+Number(x.amount||0),0);
return `${addHeader(t('expenses'),finFormOpen?'':t('add'),"finFormOpen=true;render()")}<div class="cards"><div class="card"><div class="stat-label">${t('income')}</div><div class="stat-value">${money(income)}</div></div><div class="card"><div class="stat-label">${t('expense')}</div><div class="stat-value">${money(expense)}</div></div><div class="card"><div class="stat-label">Net recorded</div><div class="stat-value">${money(income-expense)}</div></div></div>${f}<section class="panel">${table([t('date'),t('financeType'),t('categoryName'),t('amount'),t('payment'),t('description')],db.finance.slice().reverse().map(x=>rowCells([esc(x.date),esc(x.type),esc(x.category),money(x.amount),esc(x.payment||'—'),esc(x.description||'—')])) )}</section>`}
function saveFinance(e){e.preventDefault();db.finance.push(Object.fromEntries(new FormData(e.target)));finFormOpen=false;saveDB()}
function reportsPage(){let live=liveGoats(),dead=db.goats.filter(g=>g.status==='dead').length,sold=db.goats.filter(g=>g.status==='sold').length;let income=db.finance.filter(x=>x.type==='Income').reduce((s,x)=>s+Number(x.amount||0),0),expense=db.finance.filter(x=>x.type==='Expense').reduce((s,x)=>s+Number(x.amount||0),0);return `${addHeader(t('reports'))}<div class="cards"><div class="card"><div class="stat-label">${t('total')}</div><div class="stat-value">${live.length}</div></div><div class="card"><div class="stat-label">${t('mortality')}</div><div class="stat-value">${dead}</div><div class="stat-note">Recorded dead animals</div></div><div class="card"><div class="stat-label">${t('transactions')}</div><div class="stat-value">${db.transactions.length}</div></div><div class="card"><div class="stat-label">Recorded net</div><div class="stat-value">${money(income-expense)}</div></div></div><section class="panel"><h3>${t('liveStock')}</h3>${table([t('sex'),'Count'],[{label:t('male'),n:live.filter(g=>g.sex==='Male').length},{label:t('female'),n:live.filter(g=>g.sex==='Female').length},{label:'Unknown',n:live.filter(g=>g.sex==='Unknown').length},{label:'Sold',n:sold},{label:'Dead',n:dead}].map(x=>rowCells([x.label,x.n])))}</section><section class="panel"><h3>${t('reportsTitle')} — Export</h3><div class="form-actions">${Object.keys(db).map(k=>`<button class="secondary" onclick="downloadCSV('${k}')">${t('exportCSV')}: ${k}</button>`).join('')}<button onclick="exportBackup()">${t('backup')} JSON</button></div></section><div class="notice">${t('dataWarning')}</div>`}
function deleteRecord(collection,id){if(!confirm(t('confirmDelete')))return;db[collection]=db[collection].filter(x=>x.id!==id);saveDB()}
function downloadCSV(collection){const rows=db[collection]||[];if(!rows.length){alert('No records to export.');return}const keys=[...new Set(rows.flatMap(o=>Object.keys(o)))];const csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`goat-farm-${collection}-${today()}.csv`;a.click();URL.revokeObjectURL(a.href)}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`goat-farm-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!confirm('Replace current browser data with this backup? Export a backup first if needed.'))return;db={...blankDB,...imported};saveDB();alert('Backup restored.')}catch(err){alert('Invalid backup file.')}};reader.readAsText(file);e.target.value=''}
document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));render();
</script>
